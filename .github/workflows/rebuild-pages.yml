name: Rebuild GitHub Pages

"on":
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Check selected branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Select the main branch in the Run workflow menu."
            exit 1
          fi

      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          echo "Build requested. Follow **pages build and deployment** in [Actions]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions) for the result." >> "$GITHUB_STEP_SUMMARY"
